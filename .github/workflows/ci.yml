name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pipeline tests
        run: python3 pipeline/tests/test_pipeline.py

      - name: Run API tests
        run: python3 api/tests/test_api.py

      - name: Check pipeline build
        run: python3 pipeline/build.py --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend smoke test
        run: node --test web/tests/smoke.mjs
